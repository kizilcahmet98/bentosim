<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" role="img" aria-labelledby="title desc">
<title id="title">Bentosim — balina önizlemesi</title>
<desc id="desc">104 sütun ve 12 satırlık mevcut balina çizimi. Beş baloncuk hava deliğinin hemen üstünde, gerçek çıkış hesabıyla hizalıdır. Bu görsel koddan üretilmiş statik bir önizlemedir.</desc>
